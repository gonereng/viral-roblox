services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD}
      APP_SECRET: ${APP_SECRET:?set APP_SECRET}
      MEDIA_ROOT: /app/media
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      YOUTUBE_COOKIES: ${YOUTUBE_COOKIES:-/app/media/youtube_cookies.txt}
    volumes:
      - ./media:/app/media
