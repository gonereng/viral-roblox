[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roblox-viral"
version = "0.1.0"
description = "Generate vertical Roblox storytime videos with TTS and karaoke captions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "edge-tts>=6.1.9",
]

[project.scripts]
roblox-viral = "roblox_viral.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
