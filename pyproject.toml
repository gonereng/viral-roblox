[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roblox-viral"
version = "0.1.0"
description = "Generate vertical Roblox storytime videos with TTS and karaoke captions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "edge-tts>=6.1.9",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "jinja2>=3.1.0",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2.0",
  "httpx>=0.27.0",
  "Pillow>=10.0.0",
]

[project.scripts]
roblox-viral = "roblox_viral.cli:main"
roblox-viral-web = "roblox_viral.web.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
roblox_viral = ["web/templates/*.html", "web/static/*", "assets/*"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
