{% extends "base.html" %}
{% block title %}Login — Roblox Viral{% endblock %}
{% block content %}
  <h1>Login</h1>
  {% if error %}
  <p>{{ error }}</p>
  {% endif %}
  <form method="post" action="/login">
    <label>
      Password
      <input type="password" name="password" required autofocus>
    </label>
    <button type="submit">Sign in</button>
  </form>
{% endblock %}
