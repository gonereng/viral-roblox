{% extends "base.html" %}
{% block title %}Generate — Roblox Viral{% endblock %}
{% block content %}
  <h1>Generate</h1>
  <p class="lede">Pick a source clip, paste a story (one sentence per line), choose a voice.</p>

  <form id="generate-form" class="generate-form">
    <label>
      Source video
      <select id="source_name" name="source_name" required>
        {% if not sources %}
        <option value="" disabled selected>No sources — upload in Library</option>
        {% else %}
        {% for s in sources %}
        <option value="{{ s.name }}">{{ s.name }}</option>
        {% endfor %}
        {% endif %}
      </select>
    </label>

    <label>
      Story
      <textarea id="story" name="story" rows="10" required placeholder="One sentence per line."></textarea>
    </label>

    <label>
      Voice
      <select id="voice" name="voice" required>
        {% for v in voices %}
        <option value="{{ v.short_name }}"{% if v.short_name == default_voice %} selected{% endif %}>
          {{ v.short_name }} ({{ v.gender }})
        </option>
        {% endfor %}
      </select>
    </label>

    <button id="generate-btn" type="submit"{% if not sources %} disabled{% endif %}>Generate</button>
  </form>

  <section class="progress" aria-live="polite">
    <p>Status: <span id="status">idle</span></p>
    <p id="error" class="error" hidden></p>
  </section>

  <section class="result" id="result" hidden>
    <video id="player" controls playsinline></video>
    <p><a id="download" href="#" download>Download MP4</a></p>
  </section>
{% endblock %}
{% block scripts %}
  <script src="/static/app.js" defer></script>
{% endblock %}
